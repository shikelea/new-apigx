# APIGX 本地开发用 Redis 配置（Windows 便携版 5.0.14.1）
#
# 启动（在仓库根目录，先 dot-source 环境）：
#   . .\tools\dev\env.ps1
#   redis-server.exe deploy\local\redis.conf
#
# 说明：本地开发只需内存 + 单实例原子操作，因此关闭持久化。
# 计划书要求「Redis 不是历史账本」：并发/速率预留放 Redis，
# 用量与价格快照落 PostgreSQL —— 所以本地 Redis 允许丢数据。

bind 127.0.0.1
port 6379
protected-mode yes

# 开发环境关闭落盘快照与 AOF
save ""
appendonly no

# 相对 cwd（仓库根）解析
dir ./.toolchain/redis/data
dbfilename dump.rdb

# 日志输出到控制台，便于直接观察
logfile ""
loglevel notice

# 开发期上限，防止误用整机内存
maxmemory 256mb
maxmemory-policy noeviction

databases 16
